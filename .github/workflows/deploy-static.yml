# 推送 main 时构建并发布到腾讯云 CloudBase 静态托管。
# GitHub Pages 部署流程已暂时停用（保留 CloudBase 发布）。
# CloudBase：在仓库 Secrets 配置 TCB_SECRET_ID、TCB_SECRET_KEY、TCB_ENV_ID。
name: Deploy static (CloudBase)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-cloudbase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (CloudBase)
        run: npm run build

      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli

      - name: Check CloudBase secrets (no values printed)
        env:
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
        run: |
          if [ -z "$TCB_SECRET_ID" ] || [ -z "$TCB_SECRET_KEY" ] || [ -z "$TCB_ENV_ID" ]; then
            echo "::error::请在仓库 Settings → Secrets and variables → Actions 中配置 TCB_SECRET_ID、TCB_SECRET_KEY、TCB_ENV_ID"
            exit 1
          fi
          if [ "$TCB_SECRET_ID" != "${TCB_SECRET_ID#"${TCB_SECRET_ID%%[![:space:]]*}"}" ] || \
             [ "$TCB_SECRET_ID" != "${TCB_SECRET_ID%"${TCB_SECRET_ID##*[![:space:]]}"}" ]; then
            echo "::error::TCB_SECRET_ID 含首尾空格，请删除该 Secret 后重新粘贴保存"
            exit 1
          fi
          case "$TCB_SECRET_ID" in
            AKID*) echo "SecretId 前缀检查通过" ;;
            *) echo "::warning::SecretId 通常以 AKID 开头；请确认填的是 CAM「API 密钥」的 SecretId，不是环境 ID / AppId" ;;
          esac
          echo "SecretId 长度: ${#TCB_SECRET_ID}；SecretKey 长度: ${#TCB_SECRET_KEY}；EnvId 长度: ${#TCB_ENV_ID}"

      - name: Deploy to CloudBase Static Hosting
        env:
          CI: "true"
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
        run: |
          tcb login --apiKeyId "$TCB_SECRET_ID" --apiKey "$TCB_SECRET_KEY"
          tcb hosting deploy ./dist / -e "$TCB_ENV_ID" --yes
