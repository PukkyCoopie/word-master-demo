# 推送 main 时构建并同时发布：GitHub Pages + 腾讯云 CloudBase 静态托管。
# 每个 workflow run 只能有一次 upload-pages-artifact（固定名 github-pages）。
# GitHub Pages：仓库 Settings → Pages → Source 选「GitHub Actions」。
# CloudBase：在仓库 Secrets 配置 TCB_SECRET_ID、TCB_SECRET_KEY、TCB_ENV_ID。
name: Deploy static (GitHub Pages + CloudBase)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: static-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # https://<用户>.github.io/<仓库名>/ 须与子路径 base 一致
      - name: Build (GitHub Pages)
        run: npm run build -- --base=/${{ github.event.repository.name }}/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-cloudbase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (CloudBase)
        run: npm run build

      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli

      - name: Check CloudBase secrets (no values printed)
        env:
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
        run: |
          if [ -z "$TCB_SECRET_ID" ] || [ -z "$TCB_SECRET_KEY" ] || [ -z "$TCB_ENV_ID" ]; then
            echo "::error::请在仓库 Settings → Secrets and variables → Actions 中配置 TCB_SECRET_ID、TCB_SECRET_KEY、TCB_ENV_ID"
            exit 1
          fi
          if [ "$TCB_SECRET_ID" != "${TCB_SECRET_ID#"${TCB_SECRET_ID%%[![:space:]]*}"}" ] || \
             [ "$TCB_SECRET_ID" != "${TCB_SECRET_ID%"${TCB_SECRET_ID##*[![:space:]]}"}" ]; then
            echo "::error::TCB_SECRET_ID 含首尾空格，请删除该 Secret 后重新粘贴保存"
            exit 1
          fi
          case "$TCB_SECRET_ID" in
            AKID*) echo "SecretId 前缀检查通过" ;;
            *) echo "::warning::SecretId 通常以 AKID 开头；请确认填的是 CAM「API 密钥」的 SecretId，不是环境 ID / AppId" ;;
          esac
          echo "SecretId 长度: ${#TCB_SECRET_ID}；SecretKey 长度: ${#TCB_SECRET_KEY}；EnvId 长度: ${#TCB_ENV_ID}"

      - name: Deploy to CloudBase Static Hosting
        env:
          CI: "true"
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
        run: |
          tcb login --apiKeyId "$TCB_SECRET_ID" --apiKey "$TCB_SECRET_KEY"
          tcb hosting deploy ./dist / -e "$TCB_ENV_ID" --yes

  deploy-github-pages:
    needs: build-pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
