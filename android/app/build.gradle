apply plugin: 'com.android.application'

def packageJson = new groovy.json.JsonSlurper().parseText(
    file("${rootProject.projectDir}/../package.json").text
)
def appVersion = packageJson.version as String
def appVersionSlug = appVersion.replace('.', '_')
def versionParts = appVersion.tokenize('.')
def versionMajor = versionParts.size() > 0 ? (versionParts[0] as Integer) : 0
def versionMinor = versionParts.size() > 1 ? (versionParts[1] as Integer) : 0
def versionPatch = versionParts.size() > 2 ? (versionParts[2].replaceAll(/[^0-9].*/, '') as Integer) : 0
// 与 semver 同步：0.7.27 → 7027；每次 bump patch/minor/major 都会单调递增
def appVersionCode = versionMajor * 100000 + versionMinor * 1000 + versionPatch

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def releaseKeystoreConfigured = keystorePropertiesFile.exists() && keystoreProperties['storeFile']

android {
    namespace = "com.timeshift_games.word_master"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.timeshift_games.word_master"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            // 真机仅需 ARM；去掉 x86/x86_64 可显著缩小 APK（模拟器调试可临时注释本段）
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseKeystoreConfigured) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            if (releaseKeystoreConfigured) {
                signingConfig signingConfigs.release
            }
        }
        release {
            if (releaseKeystoreConfigured) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

android.applicationVariants.configureEach { variant ->
    if (variant.buildType.name != "debug") {
        return
    }
    variant.outputs.configureEach { output ->
        output.outputFileName = "word_master_debug_${appVersionSlug}.apk"
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'com.taptap.sdk:tap-core:4.10.2'
    implementation 'com.taptap.sdk:tap-login:4.10.2'
    implementation 'com.taptap.sdk:tap-compliance:4.10.2'
    implementation 'com.taptap.sdk:tap-achievement:4.10.2'
    implementation 'com.taptap.sdk:tap-review:4.10.2'
    implementation 'com.taptap.sdk:tap-moment:4.10.2'
    implementation 'com.taptap.sdk:tap-cloudsave:4.10.2'
    implementation 'com.taptap.sdk:tap-leaderboard:4.10.2'
    implementation 'com.taptap.sdk:tap-leaderboard-androidx:4.10.2'
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
